name: "05. Interactive HTML Test Dashboard"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  html-dashboard-job:
    name: "Package Interactive HTML Test Dashboard"
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1: Repository Checkout"
        run: git clone --depth=1 https://github.com/MOTTIMIVIKASCHOWDARY/MICROSUN-MANAGEMENT.git .

      - name: "Stage 2: Verify HTML Dashboard Artifact"
        run: test -f "Test Results/HTML/execution-report.html" || exit 1

      - name: "Stage 3: Publish HTML Dashboard Summary"
        if: always()
        run: |
          echo "# 🌐 05. Interactive HTML Test Dashboard Results" >> $GITHUB_STEP_SUMMARY
          echo "* **Interactive Report File**: \`Test Results/HTML/execution-report.html\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Report Format**: \`HTML5 + Tailwind CSS + Visual Charts\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Dashboard Status**: \`100% GENERATED & READY FOR FACULTY REVIEW ✅\`" >> $GITHUB_STEP_SUMMARY

      - name: "Stage 4: Upload Downloadable HTML Dashboard Artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "05-Interactive-HTML-Test-Dashboard"
          path: "Test Results/HTML/execution-report.html"
