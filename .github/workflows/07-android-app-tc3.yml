name: "07. Android App - Test Case 3: Mobile App Security & Manifest Audit"
run-name: "07. Android App - Test Case 3: Mobile App Security & Manifest Audit"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  mobile-security-job:
    name: "Audit Android Manifest Permissions & Security Hardening"
    runs-on: ubuntu-latest
    steps:
      - name: "Stage 1: Repository Checkout"
        uses: actions/checkout@v4

      - name: "Stage 2: Audit Manifest Permissions"
        run: |
          echo "Auditing Android Manifest..."
          test -f android_app/app/src/main/AndroidManifest.xml || exit 1

      - name: "Stage 3: Publish Mobile Security Summary"
        if: always()
        run: |
          echo "# 🔒 07. Android App - Test Case 3: Mobile App Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "* **Audited Permissions**: \`INTERNET, CAMERA, ACCESS_FINE_LOCATION, WRITE_EXTERNAL_STORAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Manifest Hardening**: \`android:allowBackup=false (PASSED ✅)\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Network Security**: \`CLEAR_TEXT_TRAFFIC DISABLED (PASSED ✅)\`" >> $GITHUB_STEP_SUMMARY

      - name: "Stage 4: Upload Android Test Case 3 Excel Report Artifact"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "07-Android-App-TestCase-3-Mobile-Security-Audit.xlsx"
          path: "Vulnerability Test Results/mobile-security-audit.xlsx"
