        with:
          name: "03-SECURITY-AUDIT-MASTER-EXCEL"
          path: "Vulnerability Test Results/MICROSUN_SECURITY_AUDIT_MASTER.xlsx"

      - name: "Upload Separate HTML Dashboard"
        uses: actions/upload-artifact@v4
        with:
          name: "04-HTML-EXECUTION-DASHBOARD"
          path: "Test Results/HTML/execution-report.html"
