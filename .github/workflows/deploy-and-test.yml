        run: git clone --depth=1 https://github.com/MOTTIMIVIKASCHOWDARY/MICROSUN-MANAGEMENT.git .

      - name: "Upload Master Excel Workbook"
        uses: actions/upload-artifact@v4
        with:
          name: "01-MICROSUN-OFFICIAL-MASTER-TEST-REPORT-EXCEL"
          path: MICROSUN_OFFICIAL_TEST_REPORT.xlsx

      - name: "Upload Separate Passed Test Cases Excel"
        uses: actions/upload-artifact@v4
        with:
          name: "02-PASSED-TEST-CASES-EXCEL"
          path: "Test Results/Excel/Passed_Test_Cases.xlsx"

      - name: "Upload Separate Security Master Excel"
