  master-excel-artifact:
    name: "13. Master Excel & Report Evidence Archiving"
    needs: [auth-onboarding-tests, planter-ai-tests, banana-armor-tests, sky-intel-tests, rentrox-tests, yexa-yield-tests, market-b2c-tests, profile-region-tests, multilingual-tests, master-e2e-journey, load-baseline-tests, devsecops-audit]
