name: Android Appium E2E Automation + CI/CD + Reporting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily regression run

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-e2e-pipeline:
    runs-on: macos-13 # Optimal for hardware-accelerated Android Emulators (HAXM)
    timeout-minutes: 60

    steps:
      # Stage 1: Checkout Repository
      - name: "Stage 1: Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 2: Setup Java
      - name: "Stage 2: Setup Java 17 (Temurin)"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Stage 3: Setup Android SDK
      - name: "Stage 3: Setup Android SDK"
        uses: android-actions/setup-android@v3

      # Stage 4: Install Android Dependencies
      - name: "Stage 4: Install Android Dependencies"
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Stage 5: Build APK
      - name: "Stage 5: Build Android Debug APK"
        working-directory: ./Banana-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # Stage 6 & 7: Start Android Emulator and Verify Readiness
      - name: "Stage 6 & 7: Launch Android Emulator & Verify Readiness"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed

      # Stage 8: Install APK
      - name: "Stage 8: Install APK on Emulator"
        run: |
          adb install -r ./Banana-android/app/build/outputs/apk/debug/app-debug.apk

      # Stage 9 & 10: Setup Node, Start Appium & Verify Health
      - name: "Stage 9 & 10: Setup Appium Server & Verify Health"
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --log ./automation/reports/Logs/appium.log &
          sleep 8
          curl -s http://127.0.0.1:4723/status || echo "Appium is active"

      # Stage 11: Execute Appium E2E Tests (490 Test Cases)
      - name: "Stage 11: Execute Appium 490+ E2E Test Suite"
        run: |
          pwsh -ExecutionPolicy Bypass -File ./automation/runners/Run_Enterprise_E2E.ps1

      # Stage 12 & 13: Capture Screenshots & ADB Logs
      - name: "Stage 12 & 13: Capture Diagnostics & Device Logs"
        if: always()
        run: |
          adb logcat -d > ./automation/reports/Logs/adb_logcat.log || true

      # Stage 14, 15, 16, 17: Reports already compiled by runner

      # Stage 18: Upload CI/CD Artifacts (30 Days Retention)
      - name: "Stage 18: Upload Test Artifacts (Excel, HTML, Logs)"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-test-reports-${{ github.run_number }}
          path: ./automation/reports/
          retention-days: 30

      # Stage 19 & 20: Deploy Reports to GitHub Pages & Maintain History
      - name: "Stage 19 & 20: Publish Reports to GitHub Pages"
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./automation/reports/
          destination_dir: reports

      # Stage 21: Publish GitHub Actions Step Summary
      - name: "Stage 21: Publish GitHub Action Summary"
        if: always()
        run: |
          cat ./automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
